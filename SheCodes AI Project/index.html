<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Special+Elite&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <link rel="stylesheet" href="src/styles.css" />
    <title> AI Quote Generator </title>
</head>

<body>

    <div class="container">

        <header>
            <h1> Quote Generator</h1>
        </header>

        <main>
            <div class="form-container">

                <form id="quoteGenerator" class="quote-form">
                    <input type="text" id="input" placeholder="Please enter a topic..." autocomplete="off" autofocus
                        required />
                    <input type="submit" class="generate-button" value="Generate Quote" />


                </form>
                <div class="example-text"> Example: life, death, happiness or peace </div>
            </div>
            <div class="hidden" id="quoteOutput">
            </div>
        </main>
        <footer>
            <p>
                This AI project was coded by
                <a href="https://github.com/cwildlife" target="_blank">Celeste Rust</a> and the code is available
                <a href="https://github.com/cwildlife/ai-generator-celeste" target="_blank"> on GitHub</a> and it is
                <a href="https://celeste-ai-generator-project.vercel.app/" target="_blank">hosted on Vercel</a>
            </p>
        </footer>

        <script src="src/script.js"></script>
    </div>
</body>

</html>
