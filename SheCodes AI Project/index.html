<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/styles.css" />
    <title> AI Quote Generator </title>
</head>

<body>
    <header>
        <h1> Quote Generator</h1>
    </header>

    <main>
        <form>
            <input type="text" id="userInput" placeholder="Enter a topic..." autocomplete="off" autofocus required />
            <input type="submit" value="Generate Quote" />
        </form>

    </main>
    <p>
        Loading an inspirational quote from the AI model may take a few seconds.
        <br />
        Please be patient...
    </p>
    <div>
        Inspirational quote will be displayed here.
    </div>

    <footer>
        <p>
            This AI project was coded by
            <a href="https://github.com/cwildlife" target="_blank">Celeste Rust</a> and the code is available
            <a href="https://github.com/cwildlife/ai-generator-celeste" target="_blank"> on GitHub</a> and it is
            <a href="https://celeste-ai-generator-project.vercel.app/" target="_blank">hosted on Vercel</a>
        </p>
    </footer>

    <script src="src/script.js"></script>
</body>

</html>
